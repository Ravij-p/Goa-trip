<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ravij’s Goa Drive</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F1;--card:#fff;--ink:#0E2A3B;--mute:#5B7080;--line:#D5DEE0;--early:#0B8A5F;--late:#C2410C;--ok:#1B6FA8;--glow:#19C3E6}
@media(prefers-color-scheme:dark){:root{--bg:#0A1822;--card:#102532;--ink:#E6F1F5;--mute:#8CA5B3;--line:#1E3A4B;--early:#3DDC9A;--late:#FF9A5C;--ok:#6CC4F2}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,.big{font-family:'Bricolage Grotesque',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
h1{font-size:19px;margin:0;font-weight:700}
.tabs{display:flex;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;border-radius:8px;font:inherit;font-size:13px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#map{height:34vh;min-height:220px;border-block:1px solid var(--line)}
main{max-width:720px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.big{font-size:38px;line-height:1.05;font-weight:700;margin:2px 0 4px}
.early{color:var(--early)}.late{color:var(--late)}.ontime{color:var(--ok)}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 13px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:focus-visible,.tabs button:focus-visible,li:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:14px}
.kv b{display:block;font-size:12px;font-weight:500;color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
li:first-child{border-top:0}
li.target{background:color-mix(in srgb,var(--glow) 12%,transparent);border-radius:8px;padding-inline:8px}
li.done{opacity:.6}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700}
li.done .dot{background:var(--early);border-color:var(--early);color:#fff}
li.target .dot{background:var(--glow);border-color:var(--glow);color:#06202b}
.nm{font-weight:600}
.pin{background:var(--ink);color:var(--bg);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11px system-ui;border:2px solid var(--glow)}
